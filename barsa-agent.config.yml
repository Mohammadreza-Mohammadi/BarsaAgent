server:
  port: 4310
# مسیر باید executable واقعی باشد، نه shim ویندوزی code.cmd.
editor:
  command: "C:/Users/a/AppData/Local/Programs/Microsoft VS Code/Code.exe"
repos:
  - id: barsa-novin-ray
    path: "C:/ng-web-systemsaz-1"
    managerScript: "scripts/manager.js"
run:
  maxConcurrent: 2
  autoStartOnCreate: true
  autoResumeAfterAnswer: true
issueSource:
  baseUrl: "https://portal.barsasoft.com"
  listPath: "/api2/Issue/0.1/GetIssues"
  method: "POST"
  bodyFormat: "json"
  body:
    UserId: "${BARSA_ISSUE_USER_ID}"
  itemsPath: "data.items"
  mapping:
    externalId: "externalId"
    title: "title"
    body: "body"
    url: "url"
    status: "status"
    labels: "labels"
